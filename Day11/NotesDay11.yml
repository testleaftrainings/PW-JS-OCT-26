# **What is Method Overloading in TypeScript?**

**Method overloading** means:

Defining multiple method signatures with the **same method name but different parameters**, allowing a method to handle different types or numbers of arguments.

### **Conditions**

1. Same method name.
2. Different number of parameters or parameter types.
3. Only one actual method implementation is allowed.
4. The implementation must handle all method signatures.

## **Example — Real Project Scenario in Playwright**

Imagine you want a reusable `click()` method in `BasePage.ts` that accepts either a Locator or a String selector.

**BasePage.ts**

```
import { Page, Locator } from "@playwright/test";

export class BasePage {

    // Method signature 1
    async click(element: Locator): Promise<void>;

    // Method signature 2
    async click(selector: string): Promise<void>;

    // Actual implementation
    async click(element: Locator | string): Promise<void> {

        if (typeof element === "string") {
            await this.page.locator(element).click();
        } else {
            await element.click();
        }
    }

    constructor(private page: Page) {}
}
```

**Calling the method:**

```
await login.click(page.locator("#login"));

await login.click("#login");
```

### **What Happens?**

- First call accepts a Locator.
- Second call accepts a String selector.
- Both calls execute the same `click()` method.

## **Method Overriding vs Method Overloading**

| Overriding                          | Overloading                |
| ----------------------------------- | -------------------------- |
| Requires inheritance                | No inheritance required    |
| Parent and child classes            | Usually same class         |
| Child changes parent implementation | Multiple method signatures |
| Runtime polymorphism                | Compile-time polymorphism  |

Interview Tip

"Method overloading allows us to define multiple method signatures with the same name but different parameters. TypeScript supports multiple signatures but only one actual implementation."

