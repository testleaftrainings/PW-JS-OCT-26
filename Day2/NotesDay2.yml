Login Retry Example (Framework Level) - do while loop :
-----------------------------------------
let loginSuccess;
let attempt = 0;

do {
    loginSuccess = await performLogin(username, password);
    attempt++;

} while (!loginSuccess && attempt < 3);

if (!loginSuccess) {
    console.log("Account locked or invalid credentials");
}

Above code explanation :

This code shows a login retry system. It automatically tries to log a user in up to 3 times before giving up.
Here is how it works, broken down step by step:

1. The Setup (Variables)

• let loginSuccess;: A box that will hold either true (login worked) or false (login failed).
• let attempt = 0;: A counter that starts at 0 to keep track of how many times we have tried to log in.

2. The do...while Loop (The Action)

A do...while loop always runs the code inside it at least once before checking if it needs to repeat.
Inside the loop:
1. loginSuccess = await performLogin(...): The system tries to log the user in.
2. attempt++;: The counter goes up by 1 (e.g., from 0 to 1).

3. The Condition (Should we try again?)

After each attempt, the code looks at the while rule: (!loginSuccess && attempt < 3)
It will loop again only if BOTH of these conditions are true:
• !loginSuccess: The login failed (it is not successful).
• attempt < 3: We have tried fewer than 3 times.
If the login succeeds or if we hit 3 attempts, the loop stops.

4. The Final Check

Once the loop ends, the code checks: if (!loginSuccess)
• If the login still failed after all attempts, it prints: "Account locked or invalid credentials".
• If the login was successful, it skips this and lets the user into the app.


